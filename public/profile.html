<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile - Manzzy ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    animation: { 'slide-up': 'slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards' },
                    keyframes: { slideUp: { '0%': { transform: 'translateY(40px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } } }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: white; overflow-x: hidden; }
        
        /* Glassmorphism Premium */
        .glass-panel {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-panel:hover { border-color: var(--theme-color, #a855f7); box-shadow: 0 10px 40px -10px var(--theme-glow, rgba(168,85,247,0.1)); }

        /* KARTU MEMBER DINAMIS */
        .member-card {
            background: linear-gradient(135deg, #0f0f10 0%, #18181b 100%);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.8);
        }
        /* Border Glow Dinamis sesuai Tema */
        .member-card::after {
            content: ''; position: absolute; inset: 0; padding: 1px; border-radius: inherit;
            background: linear-gradient(135deg, var(--theme-color, #a855f7), transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }
        .member-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, var(--theme-glow, rgba(168,85,247,0.15)) 0%, transparent 70%);
            transform: rotate(30deg); pointer-events: none;
        }
        .member-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 30px 60px -20px var(--theme-glow, rgba(168,85,247,0.3)); }
        
        .chip {
            background: linear-gradient(135deg, #fbbf24 0%, #b45309 100%);
            box-shadow: inset 0 1px 4px rgba(255,255,255,0.3);
        }

        /* Elements */
        .input-dark {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: white; transition: all 0.3s ease;
        }
        .input-dark:focus { border-color: var(--theme-color, #a855f7); outline: none; box-shadow: 0 0 0 2px var(--theme-glow, rgba(168, 85, 247, 0.2)); }

        .btn-gradient {
            background: linear-gradient(135deg, var(--theme-color, #9333ea) 0%, #000 150%);
            position: relative; overflow: hidden; transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px var(--theme-glow, rgba(147, 51, 234, 0.4)); }

        /* Custom Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .theme-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; border: 2px solid transparent; }
        .theme-dot:hover { transform: scale(1.2); }
        .theme-dot.active { border-color: white; box-shadow: 0 0 10px currentColor; }

        /* Animation Delays */
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-400 { animation-delay: 400ms; }
    </style>
</head>
<body class="min-h-screen relative pb-20">
    
    <div class="fixed top-0 left-0 w-full h-96 bg-gradient-to-b from-[var(--theme-glow)]/10 to-transparent -z-10 transition-colors duration-700" id="bg-glow-top"></div>
    <div class="fixed bottom-0 right-0 w-80 h-80 bg-blue-900/10 rounded-full blur-[120px] -z-10"></div>

    <nav class="p-6 flex items-center justify-between max-w-2xl mx-auto opacity-0 animate-slide-up">
        <a href="/" class="flex items-center gap-3 text-gray-400 hover:text-white transition group py-2 px-3 rounded-full hover:bg-white/5">
            <i class="fa-solid fa-arrow-left group-hover:-translate-x-1 transition"></i>
            <span class="text-sm font-bold">Dashboard</span>
        </a>
        <h1 class="text-xs font-bold tracking-[0.3em] text-gray-500 uppercase">Profile Settings</h1>
        <div class="w-8"></div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 mt-2 space-y-6">
        
        <div class="member-card rounded-[1.5rem] p-7 aspect-[1.6/1] flex flex-col justify-between relative group opacity-0 animate-slide-up delay-100">
            <div class="flex justify-between items-start z-10">
                <div class="flex items-center gap-3">
                    <img id="card-avatar-img" src="" class="w-12 h-12 rounded-full border border-white/20 bg-white/5 p-0.5 object-cover">
                    <div>
                        <h3 class="text-gray-400 text-[9px] uppercase tracking-[0.2em]" id="card-badge-display">MEMBER</h3>
                        <div class="text-xl font-bold italic tracking-wide text-white drop-shadow-md">MANZZY<span style="color: var(--theme-color)">ID</span></div>
                    </div>
                </div>
                <i class="fa-brands fa-cc-visa text-4xl text-white/20"></i>
            </div>

            <div class="flex items-center gap-4 z-10 pl-1 mt-2">
                <div class="chip w-12 h-9 rounded-[6px]"></div>
                <i class="fa-solid fa-wifi rotate-90 text-white/30 text-xl"></i>
            </div>

            <div class="z-10">
                <div class="flex justify-between items-end">
                    <div>
                        <div class="text-gray-500 text-[9px] uppercase tracking-wider mb-1">Card Holder</div>
                        <div id="card-name" class="text-lg font-mono font-bold text-white tracking-widest uppercase truncate w-56">LOADING...</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[9px] text-gray-500 uppercase">Balance</div>
                        <div id="card-balance" class="text-sm font-mono font-bold text-white">Rp 0</div>
                    </div>
                </div>
                <div class="mt-4 font-mono text-xs text-white/50 tracking-[0.3em]" id="card-id">0000 0000 0000</div>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-3xl opacity-0 animate-slide-up delay-200">
            <h3 class="text-sm font-bold text-white mb-5 flex items-center gap-2">
                <i class="fa-solid fa-paintbrush text-[var(--theme-color)]"></i> Personalisasi Tampilan
            </h3>
            
            <div class="mb-6">
                <label class="text-[10px] text-gray-400 font-bold uppercase mb-3 block tracking-wider">Pilih Tema Kartu</label>
                <div class="flex gap-4">
                    <div class="theme-dot bg-purple-500 text-purple-500" onclick="setTheme('#a855f7', 'rgba(168,85,247,0.3)')"></div>
                    <div class="theme-dot bg-blue-500 text-blue-500" onclick="setTheme('#3b82f6', 'rgba(59,130,246,0.3)')"></div>
                    <div class="theme-dot bg-red-500 text-red-500" onclick="setTheme('#ef4444', 'rgba(239,68,68,0.3)')"></div>
                    <div class="theme-dot bg-emerald-500 text-emerald-500" onclick="setTheme('#10b981', 'rgba(16,185,129,0.3)')"></div>
                    <div class="theme-dot bg-yellow-500 text-yellow-500" onclick="setTheme('#eab308', 'rgba(234,179,8,0.3)')"></div>
                </div>
            </div>

            <div class="mb-6">
                <label class="text-[10px] text-gray-400 font-bold uppercase mb-2 block tracking-wider">Pilih Gelar / Badge</label>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2" id="badge-list">
                    </div>
            </div>

            <div>
                <label class="text-[10px] text-gray-400 font-bold uppercase mb-2 block tracking-wider">Pilih Avatar 3D</label>
                <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2" id="avatar-list">
                    </div>
            </div>
        </div>

 <div class="glass-panel p-6 rounded-3xl opacity-0 animate-slide-up delay-300 relative overflow-hidden group">
            <div class="absolute -right-6 -top-6 text-8xl text-white/5 rotate-12 group-hover:rotate-0 transition duration-700">
                <i class="fa-solid fa-code"></i>
            </div>

            <div class="flex items-center justify-between mb-4 relative z-10">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-[var(--theme-color)]/20 flex items-center justify-center text-[var(--theme-color)] border border-[var(--theme-color)]/30">
                        <i class="fa-solid fa-terminal text-xs"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-white">Developer API</h3>
                        <p class="text-[10px] text-gray-500">Integrasi Bot & H2H</p>
                    </div>
                </div>
                
                <a href="/docs.html" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition text-[10px] font-bold text-gray-300 hover:text-white group-btn">
                    <i class="fa-solid fa-book-open text-[var(--theme-color)]"></i>
                    Docs
                </a>
            </div>

            <div class="bg-black/50 border border-gray-700 rounded-xl p-3 flex items-center justify-between gap-3 mb-3 relative overflow-hidden">
                <div class="font-mono text-xs text-green-400 tracking-wider truncate select-all" id="api-key-display">Belum ada API Key</div>
                <button onclick="copyApiKey()" class="text-gray-400 hover:text-white transition tooltip" title="Salin Key"><i class="fa-solid fa-copy"></i></button>
                
                <div class="absolute top-0 left-0 w-full h-[1px] bg-green-500/50 shadow-[0_0_10px_#22c55e] animate-ping" style="animation-duration: 3s"></div>
            </div>

            <button onclick="generateApiKey()" class="w-full py-2.5 rounded-lg border border-dashed border-gray-600 text-gray-400 text-xs font-bold hover:border-[var(--theme-color)] hover:text-[var(--theme-color)] hover:bg-[var(--theme-color)]/5 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate"></i> GENERATE NEW KEY
            </button>
        </div>

        <div class="glass-panel rounded-3xl p-6 mb-24 opacity-0 animate-slide-up delay-400">
            <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-lock text-gray-500"></i> Ganti Password
            </h3>
            <div class="space-y-4">
                <div class="relative">
                    <input type="password" id="new-password" class="w-full input-dark rounded-xl p-3.5 text-xs font-mono tracking-widest pr-10" placeholder="Password Baru">
                    <i onclick="togglePass()" class="fa-solid fa-eye absolute right-4 top-3.5 text-gray-500 cursor-pointer hover:text-white transition text-xs"></i>
                </div>
                <button onclick="savePassword()" id="btn-save" class="btn-gradient w-full text-white font-bold py-3 rounded-xl shadow-lg text-xs tracking-wider uppercase">
                    Simpan Password
                </button>
                <div class="flex justify-center pt-2">
                    <button onclick="doLogout()" class="text-[10px] text-red-500 hover:text-red-400 font-bold flex items-center gap-2 px-4 py-2 rounded-lg hover:bg-red-500/10 transition uppercase tracking-widest">
                        <i class="fa-solid fa-power-off"></i> Logout
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const userSession = localStorage.getItem('user_session');
        
        // --- DATA PILIHAN (Avatar & Badge) ---
        const avatars = ['Felix', 'Aneka', 'Zoe', 'Bear', 'Tiger', 'Leo', 'Max'];
        const badges = [
            { id: 'MEMBER', label: 'Member' },
            { id: 'SULTAN', label: '👑 Sultan' },
            { id: 'JURAGAN', label: '💰 Juragan' },
            { id: 'RESELLER', label: '🤝 Reseller' },
            { id: 'BOS', label: '😎 Bos Muda' },
            { id: 'HACKER', label: '💻 Hacker' }
        ];

        // Load Preferences
        let currentAvatar = localStorage.getItem('pref_avatar') || 'Felix';
        let currentTheme = localStorage.getItem('pref_theme_color') || '#a855f7';
        let currentGlow = localStorage.getItem('pref_theme_glow') || 'rgba(168,85,247,0.3)';
        let currentBadge = localStorage.getItem('pref_badge') || 'MEMBER';
        let currentApiKey = localStorage.getItem('pref_api_key_' + userSession) || null;

        document.addEventListener('DOMContentLoaded', async () => {
            if(!userSession) { window.location.href = '/login_user.html'; return; }
            
            // 1. Terapkan Tema Tersimpan
            applyTheme(currentTheme, currentGlow);
            
            // 2. Render UI Options
            renderAvatars();
            renderBadges();
            updateCardDisplay();
            
            if(currentApiKey) document.getElementById('api-key-display').innerText = currentApiKey;

            // 3. Ambil Data Real dari Server
            try {
                const res = await fetch(`/api/user/${userSession}`);
                const data = await res.json();
                
                if(data.username) {
                    document.getElementById('card-name').innerText = data.username;
                    document.getElementById('card-id').innerText = generateFakeCardNumber(data.username);
                    document.getElementById('card-balance').innerText = `Rp ${data.balance.toLocaleString()}`;
                }
            } catch(e) { console.error(e); }
        });

        // --- THEME LOGIC ---
        function setTheme(color, glow) {
            currentTheme = color;
            currentGlow = glow;
            localStorage.setItem('pref_theme_color', color);
            localStorage.setItem('pref_theme_glow', glow);
            applyTheme(color, glow);
        }

        function applyTheme(color, glow) {
            document.documentElement.style.setProperty('--theme-color', color);
            document.documentElement.style.setProperty('--theme-glow', glow);
            
            // Highlight active dot
            document.querySelectorAll('.theme-dot').forEach(d => {
                if(d.classList.contains(`text-[${color}]`) || d.style.color === color) d.classList.add('active'); // Simplifikasi visual
                else d.classList.remove('active');
            });
        }

        // --- BADGE LOGIC ---
        function renderBadges() {
            const list = document.getElementById('badge-list');
            list.innerHTML = badges.map(b => `
                <button onclick="selectBadge('${b.id}')" 
                    class="px-4 py-2 rounded-lg border text-xs font-bold whitespace-nowrap transition ${currentBadge === b.id ? 'bg-[var(--theme-color)] border-[var(--theme-color)] text-white' : 'bg-white/5 border-white/10 text-gray-400 hover:bg-white/10'}">
                    ${b.label}
                </button>
            `).join('');
        }

        function selectBadge(id) {
            currentBadge = id;
            localStorage.setItem('pref_badge', id);
            renderBadges();
            updateCardDisplay();
        }

        // --- AVATAR LOGIC ---
        function renderAvatars() {
            document.getElementById('avatar-list').innerHTML = avatars.map(seed => `
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=${seed}" 
                     class="w-10 h-10 rounded-full cursor-pointer bg-white/5 p-1 border-2 transition ${seed === currentAvatar ? 'border-[var(--theme-color)] scale-110' : 'border-transparent opacity-50 hover:opacity-100'}"
                     onclick="selectAvatar('${seed}')">
            `).join('');
        }

        function selectAvatar(seed) {
            currentAvatar = seed;
            localStorage.setItem('pref_avatar', seed);
            renderAvatars();
            updateCardDisplay();
        }

        function updateCardDisplay() {
            document.getElementById('card-avatar-img').src = `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentAvatar}`;
            document.getElementById('card-badge-display').innerText = badges.find(b => b.id === currentBadge)?.label || 'MEMBER';
        }

        // --- API KEY GENERATOR ---
        function generateApiKey() {
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERATING...';
            
            setTimeout(() => {
                const newKey = 'mzy_live_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                currentApiKey = newKey;
                localStorage.setItem('pref_api_key_' + userSession, newKey);
                
                document.getElementById('api-key-display').innerText = newKey;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> KEY GENERATED';
                setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-rotate"></i> GENERATE NEW KEY', 2000);
            }, 1000);
        }

        function copyApiKey() {
            const text = document.getElementById('api-key-display').innerText;
            if(text.includes('Belum')) return;
            navigator.clipboard.writeText(text);
            alert("API Key Copied!");
        }

        // --- PASSWORD ---
        async function savePassword() {
            const pass = document.getElementById('new-password').value;
            if(!pass || pass.length < 6) return alert("Password min 6 karakter.");
            
            try {
                const res = await fetch('/api/user/change-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userSession, newPassword: pass })
                });
                const d = await res.json();
                if(d.success) { alert("Sukses ganti password!"); doLogout(); }
                else alert("Gagal: " + d.msg);
            } catch(e) { alert("Error koneksi"); }
        }

        function doLogout() { localStorage.removeItem('user_session'); window.location.href='/login_user.html'; }
        function togglePass() { const x=document.getElementById('new-password'); x.type=x.type==='password'?'text':'password'; }
        function generateFakeCardNumber(str) {
            let hash = 0; for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            const num = Math.abs(hash).toString().padEnd(16, '0').slice(0, 16);
            return num.match(/.{1,4}/g).join(' '); 
        }
    </script>
</body>
</html>
