<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Member - Manzzy ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: 'Space Grotesk', sans-serif; }
        .glass-card { background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-field { width: 100%; background: #111; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-bottom: 15px; transition: 0.3s; }
        .input-field:focus { outline: none; border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        .btn-primary { width: 100%; padding: 12px; background: #8b5cf6; color: white; font-weight: bold; border-radius: 8px; transition: 0.3s; }
        .btn-primary:hover { background: #7c3aed; transform: scale(1.02); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">
    <div class="absolute top-0 left-0 w-64 h-64 bg-purple-600/20 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-0 right-0 w-64 h-64 bg-blue-600/20 rounded-full blur-[100px]"></div>

    <div class="glass-card p-8 rounded-2xl w-full max-w-md relative z-10 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-gray-400 text-sm">Masuk untuk memberi rating & akses fitur member.</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="text" id="logUser" class="input-field" placeholder="Username" required>
            <input type="password" id="logPass" class="input-field" placeholder="Password" required>
            <button type="submit" class="btn-primary mb-4">MASUK</button>
            <p class="text-center text-sm text-gray-500">Belum punya akun? <a href="#" onclick="toggleForm()" class="text-purple-400 hover:text-white font-bold">Daftar disini</a></p>
        </form>

        <form id="regForm" onsubmit="handleRegister(event)" class="hidden">
            <input type="text" id="regUser" class="input-field" placeholder="Buat Username Baru" required>
            <input type="password" id="regPass" class="input-field" placeholder="Buat Password" required>
            <button type="submit" class="btn-primary bg-green-600 hover:bg-green-700 mb-4">DAFTAR AKUN</button>
            <p class="text-center text-sm text-gray-500">Sudah punya akun? <a href="#" onclick="toggleForm()" class="text-purple-400 hover:text-white font-bold">Login disini</a></p>
        </form>
    </div>

    <script>
        function toggleForm() {
            document.getElementById('loginForm').classList.toggle('hidden');
            document.getElementById('regForm').classList.toggle('hidden');
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;
            
            const res = await fetch('/api/register-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if(data.success) {
                alert("Registrasi Berhasil! Silakan Login.");
                toggleForm();
            } else {
                alert("Gagal: " + (data.message || "Username mungkin sudah ada"));
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('logUser').value;
            const password = document.getElementById('logPass').value;
            
            const res = await fetch('/api/login-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if(data.success) {
                // Simpan sesi user di LocalStorage
                localStorage.setItem('user_session', username);
                window.location.href = '/'; // Balik ke halaman utama
            } else {
                alert("Login Gagal! Username/Password salah.");
            }
        }
    </script>
</body>
</html>
