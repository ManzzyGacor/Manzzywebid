<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Manzzy ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>body{font-family:'Space Grotesk',sans-serif;background:#050505;color:white}.glass{background:#0f0f11;border:1px solid #333}</style>
</head>
<body class="flex items-center justify-center min-h-screen relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(139,92,246,0.15),_transparent_70%)]"></div>
    
    <div class="w-full max-w-sm glass p-8 rounded-2xl shadow-2xl relative z-10 mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-widest text-white">ADMIN<span class="text-purple-500">PANEL</span></h1>
            <p class="text-gray-500 text-xs mt-2 uppercase tracking-widest">Restricted Access</p>
        </div>

        <form onsubmit="handleAdminLogin(event)" class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Username</label>
                <input type="text" id="adminUser" class="w-full bg-black/50 border border-gray-800 rounded-lg p-3 text-white focus:border-purple-500 outline-none transition" required>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-gray-500 mb-1 uppercase">Password</label>
                <input type="password" id="adminPass" class="w-full bg-black/50 border border-gray-800 rounded-lg p-3 text-white focus:border-purple-500 outline-none transition" required>
            </div>
            <button type="submit" id="btnLogin" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-purple-500/20">LOGIN SYSTEM</button>
        </form>
        
        <div class="mt-8 text-center">
            <a href="/" class="text-xs text-gray-600 hover:text-white transition">← Back to Website</a>
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Checking...';
            btn.disabled = true;

            try {
                // Fetch ke route KHUSUS ADMIN (bukan login-user)
                const res = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();

                if (data.success) {
                    // Simpan session khusus admin
                    localStorage.setItem('isAdmin', 'true');
                    localStorage.setItem('user_session', data.username);
                    localStorage.setItem('user_role', 'admin');
                    
                    // Redirect ke Dashboard
                    window.location.href = '/admin.html';
                } else {
                    alert("❌ Login Gagal: " + (data.message || "Password Salah"));
                }
            } catch (err) {
                alert("❌ Gagal terhubung ke server backend.");
                console.error(err);
            } finally {
                btn.innerHTML = 'LOGIN SYSTEM';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
