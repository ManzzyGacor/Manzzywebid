<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Manzzy ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050505; color: #e0e0e0; font-family: sans-serif; }
        .glass { background: #111; border: 1px solid #333; }
        input, textarea, select { background: #222; border: 1px solid #444; color: white; width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 6px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #8b5cf6; }
        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }
    </style>
</head>
<body class="p-6">

    <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-bold text-white">Admin Panel <span class="text-purple-500">v3.0</span></h1>
        <button onclick="logout()" class="text-red-500 text-sm hover:underline">Logout</button>
    </div>

    <div class="glass p-6 rounded-xl mb-8 border-l-4 border-l-blue-500">
        <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-server"></i> Server Control Center</h2>
        
        <details class="mb-6 bg-gray-900 p-4 rounded-lg border border-gray-800">
            <summary class="cursor-pointer text-sm text-gray-400 font-bold hover:text-white">⚙️ Konfigurasi Koneksi Panel (Klik untuk buka)</summary>
            <form id="pteroForm" onsubmit="savePteroConfig(event)" class="mt-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="pteroUrl" placeholder="Panel URL (ex: https://panel.domain.com)" required>
                    <input type="text" id="pteroKey" placeholder="Client API Key (ptlc_...)" required>
                    <input type="text" id="pteroId" placeholder="Server ID (Identifier)" required>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold w-full">Simpan Konfigurasi</button>
            </form>
        </details>

        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-4">
                <div id="server-status-indicator" class="w-4 h-4 rounded-full bg-gray-500 animate-pulse"></div>
                <div>
                    <h3 class="font-bold text-white">Status Server Bot</h3>
                    <p id="server-status-text" class="text-xs text-gray-400 font-mono">Checking...</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="sendPower('start')" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded flex items-center gap-2"><i class="fa-solid fa-play"></i> Start</button>
                <button onclick="sendPower('restart')" class="px-6 py-2 bg-yellow-600 hover:bg-yellow-700 text-white font-bold rounded flex items-center gap-2"><i class="fa-solid fa-rotate-right"></i> Restart</button>
                <button onclick="sendPower('stop')" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded flex items-center gap-2"><i class="fa-solid fa-stop"></i> Stop</button>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1">
            <div class="glass p-6 rounded-xl mb-6 sticky top-6">
                <h2 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-layer-group"></i> Tambah Kategori</h2>
                <form id="catForm" onsubmit="addCategory(event)">
                    <input type="text" id="catName" placeholder="Nama Kategori" required>
                    <input type="text" id="catImage" placeholder="URL Gambar" required>
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 rounded font-bold">Simpan</button>
                </form>
                <h3 class="text-sm text-gray-400 mt-6 mb-2 uppercase font-bold">List Kategori</h3>
                <div id="categoryList" class="space-y-3 max-h-[300px] overflow-y-auto"></div>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="glass p-6 rounded-xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-box"></i> Editor Produk</h2>
                    <button onclick="resetProductForm()" class="text-xs text-gray-500 border border-gray-700 px-2 py-1 rounded">Reset</button>
                </div>
                <form id="prodForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="editId">
                    <div class="grid grid-cols-2 gap-4">
                        <select id="prodCategory" required><option value="">-- Pilih Kategori --</option></select>
                        <div class="flex items-center gap-2 h-[42px]">
                            <label for="prodAvailable" class="flex items-center cursor-pointer relative">
                                <input type="checkbox" id="prodAvailable" class="sr-only" checked>
                                <div class="w-10 h-6 bg-gray-700 rounded-full shadow-inner"></div>
                                <div class="dot absolute w-4 h-4 bg-white rounded-full shadow left-1 top-1 transition"></div>
                            </label>
                            <span id="statusText" class="text-sm text-green-400 font-bold">Tersedia</span>
                        </div>
                    </div>
                    <input type="text" id="prodName" placeholder="Nama Produk" required>
                    <input type="text" id="prodPrice" placeholder="Harga" required>
                    <input type="text" id="prodImage" placeholder="URL Gambar">
                    <textarea id="prodDesc" rows="3" placeholder="Deskripsi..." required></textarea>
                    <button type="submit" id="btnSaveProd" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold">Tambah Produk</button>
                </form>
            </div>
            <div class="mt-8">
                <h3 class="text-lg font-bold text-white mb-4">Daftar Produk</h3>
                <div id="productList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('isAdmin') !== 'true') window.location.href = '/login.html';
        function logout() { localStorage.removeItem('isAdmin'); window.location.href = '/login.html'; }

        // --- PTERODACTYL LOGIC ---
        async function fetchPteroConfig() {
            const res = await fetch('/api/ptero/config');
            const data = await res.json();
            if(data.panelUrl) {
                document.getElementById('pteroUrl').value = data.panelUrl;
                document.getElementById('pteroKey').value = data.apiKey;
                document.getElementById('pteroId').value = data.serverId;
                checkServerStatus(); // Auto check if config exists
            }
        }

        async function savePteroConfig(e) {
            e.preventDefault();
            const data = {
                panelUrl: document.getElementById('pteroUrl').value,
                apiKey: document.getElementById('pteroKey').value,
                serverId: document.getElementById('pteroId').value
            };
            await fetch('/api/ptero/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert("Konfigurasi Panel Tersimpan!");
            checkServerStatus();
        }

        async function checkServerStatus() {
            const statusText = document.getElementById('server-status-text');
            const indicator = document.getElementById('server-status-indicator');
            
            try {
                const res = await fetch('/api/ptero/stats');
                const data = await res.json();
                
                statusText.innerText = data.status.toUpperCase();
                
                if(data.status === 'running') {
                    indicator.classList.remove('bg-gray-500', 'bg-red-500', 'bg-yellow-500');
                    indicator.classList.add('bg-green-500');
                } else if(data.status === 'offline') {
                    indicator.classList.remove('bg-gray-500', 'bg-green-500', 'bg-yellow-500');
                    indicator.classList.add('bg-red-500');
                } else {
                    indicator.classList.remove('bg-gray-500', 'bg-green-500', 'bg-red-500');
                    indicator.classList.add('bg-yellow-500');
                }
            } catch(e) { statusText.innerText = "Error Check"; }
        }

        async function sendPower(signal) {
            if(!confirm(`Yakin ingin ${signal.toUpperCase()} server?`)) return;
            const res = await fetch('/api/ptero/power', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ signal })
            });
            if(res.ok) {
                alert(`Perintah ${signal} dikirim! Tunggu sebentar...`);
                setTimeout(checkServerStatus, 3000);
            } else {
                alert("Gagal mengirim perintah. Cek config.");
            }
        }

        // --- EXISTING LOGIC (Categories & Products) ---
        let categories = [];
        async function fetchCategories() { const res = await fetch('/api/categories'); categories = await res.json(); renderCategories(); updateCategorySelect(); }
        async function addCategory(e) { e.preventDefault(); await fetch('/api/categories', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('catName').value, imageUrl: document.getElementById('catImage').value }) }); e.target.reset(); fetchCategories(); }
        async function deleteCategory(id) { if(!confirm("Hapus kategori?")) return; await fetch(`/api/categories/${id}`, { method: 'DELETE' }); fetchCategories(); }
        function renderCategories() { document.getElementById('categoryList').innerHTML = categories.map(c => `<div class="flex items-center justify-between bg-gray-800 p-3 rounded border border-gray-700"><div class="flex items-center gap-3"><img src="${c.imageUrl}" class="w-10 h-10 rounded object-cover"><span class="font-bold text-sm">${c.name}</span></div><button onclick="deleteCategory('${c._id}')" class="text-red-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button></div>`).join(''); }
        function updateCategorySelect() { document.getElementById('prodCategory').innerHTML = '<option value="">-- Pilih Kategori --</option>' + categories.map(c => `<option value="${c.name}">${c.name}</option>`).join(''); }

        async function fetchProducts() {
            const res = await fetch('/api/products'); const products = await res.json();
            document.getElementById('productList').innerHTML = products.map(p => {
                const statusColor = p.isAvailable ? 'text-green-400' : 'text-red-500';
                return `<div class="bg-gray-900 border border-gray-800 p-4 rounded-lg flex gap-4 items-start relative group hover:border-purple-500 transition"><img src="${p.imageUrl||'https://via.placeholder.com/100'}" class="w-20 h-20 rounded object-cover bg-gray-800"><div class="flex-1"><div class="flex justify-between"><span class="text-xs text-purple-400 bg-purple-900/30 px-2 py-0.5 rounded">${p.category||'Uncategorized'}</span><span class="text-xs font-bold ${statusColor}">${p.isAvailable?'Available':'Habis'}</span></div><h4 class="font-bold text-white mt-1">${p.name}</h4><p class="text-sm text-gray-400">${p.price}</p><div class="mt-3 flex gap-2"><button onclick='editProduct(${JSON.stringify(p)})' class="px-3 py-1 bg-blue-600 hover:bg-blue-700 text-xs rounded text-white">Edit</button><button onclick="deleteProduct('${p._id}')" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-xs rounded text-white">Hapus</button></div></div></div>`;
            }).join('');
        }
        async function saveProduct(e) { e.preventDefault(); const id = document.getElementById('editId').value; const data = { category: document.getElementById('prodCategory').value, isAvailable: document.getElementById('prodAvailable').checked, name: document.getElementById('prodName').value, price: document.getElementById('prodPrice').value, imageUrl: document.getElementById('prodImage').value, desc: document.getElementById('prodDesc').value }; const method = id ? 'PUT' : 'POST'; const url = id ? `/api/products/${id}` : '/api/products'; await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); resetProductForm(); fetchProducts(); }
        async function deleteProduct(id) { if(!confirm("Hapus produk?")) return; await fetch(`/api/products/${id}`, { method: 'DELETE' }); fetchProducts(); }
        function editProduct(p) { document.querySelector('.glass').scrollIntoView({ behavior: 'smooth' }); document.getElementById('editId').value = p._id; document.getElementById('prodCategory').value = p.category || ''; document.getElementById('prodName').value = p.name; document.getElementById('prodPrice').value = p.price; document.getElementById('prodImage').value = p.imageUrl; document.getElementById('prodDesc').value = p.desc; document.getElementById('prodAvailable').checked = p.isAvailable !== false; toggleStatusText(); const btn = document.getElementById('btnSaveProd'); btn.innerHTML = 'Update Produk'; btn.classList.replace('bg-green-600', 'bg-blue-600'); }
        function resetProductForm() { document.getElementById('prodForm').reset(); document.getElementById('editId').value = ''; const btn = document.getElementById('btnSaveProd'); btn.innerHTML = 'Tambah Produk'; btn.classList.replace('bg-blue-600', 'bg-green-600'); }
        document.getElementById('prodAvailable').addEventListener('change', toggleStatusText);
        function toggleStatusText() { const isChecked = document.getElementById('prodAvailable').checked; const text = document.getElementById('statusText'); const dot = document.querySelector('.dot'); if(isChecked) { text.innerText = "Tersedia"; text.className = "text-sm text-green-400 font-bold ml-2"; dot.style.transform = "translateX(100%)"; } else { text.innerText = "Tidak Tersedia"; text.className = "text-sm text-red-500 font-bold ml-2"; dot.style.transform = "translateX(0)"; } }

        // INIT
        fetchPteroConfig(); // Load Config saat buka
        fetchCategories();
        fetchProducts();
        setInterval(checkServerStatus, 10000); // Auto refresh status tiap 10 detik
    </script>
</body>
</html>
