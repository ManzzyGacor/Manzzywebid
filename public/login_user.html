<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akses Member - Manzzy ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #000000;
            background-image: 
                radial-gradient(circle at 50% 0%, #2e1065 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, #1e1b4b 0%, transparent 40%);
            background-attachment: fixed;
            color: white; 
            font-family: 'Inter', sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card-premium { 
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            border-color: #8b5cf6;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md px-6">
        <div class="glass-card-premium rounded-3xl p-8 text-center">
            <div class="mb-6">
                <div class="w-16 h-16 bg-gradient-to-tr from-purple-600 to-blue-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4 transform rotate-3">
                    <i class="fa-solid fa-bolt-lightning text-2xl text-white"></i>
                </div>
                <h2 class="text-2xl font-black tracking-tighter">MANZZY <span class="text-purple-500">ID</span></h2>
                <p id="auth-subtitle" class="text-gray-400 text-xs mt-2 uppercase tracking-widest font-bold">Login / Registrasi Otomatis</p>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold ml-1">Username</label>
                    <div class="relative mt-1">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
                        <input type="text" id="username" required placeholder="Gunakan nama simpel" 
                            class="input-focus w-full bg-white/5 border border-white/10 rounded-xl px-11 py-3.5 outline-none text-sm">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] uppercase tracking-widest text-gray-500 font-bold ml-1">Password</label>
                    <div class="relative mt-1">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-xs"></i>
                        <input type="password" id="password" required placeholder="Minimal 4 karakter" 
                            class="input-focus w-full bg-white/5 border border-white/10 rounded-xl px-11 py-3.5 outline-none text-sm">
                    </div>
                </div>

                <button type="submit" id="btn-auth" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-purple-500/20 active:scale-95 flex items-center justify-center gap-2 mt-2">
                    <span id="btn-text">MASUK / DAFTAR</span>
                    <i class="fa-solid fa-right-to-bracket text-xs"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-white/5 space-y-3">
                <p class="text-gray-500 text-[10px] leading-relaxed">
                    Sistem akan mendeteksi otomatis. Jika username belum terdaftar, akun akan langsung dibuatkan.
                </p>
                <button onclick="window.location.href='index.html'" class="text-gray-500 text-[10px] hover:text-white transition uppercase tracking-tighter">
                    <i class="fa-solid fa-house mr-1"></i> Kembali ke Beranda
                </button>
            </div>
        </div>
    </div>

    <script>
        async function handleAuth(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btn-auth');
            const btnText = document.getElementById('btn-text');
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;

            if(u.length < 3 || p.length < 3) {
                return alert("Username & Password minimal 3 karakter!");
            }

            // UI Loading
            btnText.innerText = 'MEMPROSES...';
            btn.disabled = true;
            btn.classList.add('opacity-70');

            try {
                // 1. COBA LOGIN DULU
                const loginRes = await fetch('/api/login-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                const loginData = await loginRes.json();

                if (loginData.success) {
                    saveAndRedirect(loginData);
                } else {
                    // 2. JIKA GAGAL KARENA USER TIDAK ADA, COBA DAFTAR OTOMATIS
                    if (loginData.msg.includes("tidak ditemukan") || loginData.msg.includes("Salah")) {
                        // Cek apakah user mau daftar (opsional, di sini kita buat otomatis)
                        const regRes = await fetch('/api/register-user', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: u, password: p })
                        });
                        const regData = await regRes.json();

                        if (regData.success) {
                            // Login ulang setelah daftar berhasil
                            const finalLogin = await fetch('/api/login-user', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ username: u, password: p })
                            });
                            const finalData = await finalLogin.json();
                            saveAndRedirect(finalData);
                        } else {
                            alert("❌ " + regData.msg);
                            resetBtn();
                        }
                    } else {
                        alert("❌ " + loginData.msg);
                        resetBtn();
                    }
                }
            } catch (err) {
                alert("❌ Error: Gagal terhubung ke VPS.");
                resetBtn();
            }

            function resetBtn() {
                btnText.innerText = 'MASUK / DAFTAR';
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }

            function saveAndRedirect(data) {
                // SIMPAN SESSION KE BROWSER
                localStorage.setItem('user_session', data.username);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('manzzyUser', data.username);

                btnText.innerText = 'BERHASIL!';
                btn.classList.replace('bg-purple-600', 'bg-green-600');
                
                document.body.style.transition = 'all 0.5s ease';
                document.body.style.opacity = '0';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);
            }
        }
    </script>
</body>
</html>
