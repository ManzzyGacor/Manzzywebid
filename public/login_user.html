<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Member - Manzzy ID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Space Grotesk', sans-serif; background: #050505; color: white; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="w-full max-w-md bg-[#0f0f11] p-8 rounded-2xl border border-gray-800 shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
            <p class="text-gray-500 text-sm">Login untuk akses saldo & layanan.</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-bold uppercase">Username</label>
                <input type="text" id="username" class="w-full bg-black/50 border border-gray-700 rounded-lg p-3 focus:border-purple-500 outline-none transition" required>
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1 font-bold uppercase">Password</label>
                <input type="password" id="password" class="w-full bg-black/50 border border-gray-700 rounded-lg p-3 focus:border-purple-500 outline-none transition" required>
            </div>
            <button type="submit" id="btn-login" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-purple-500/20">
                Masuk Sekarang
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
            Belum punya akun? <a href="/register_user.html" class="text-purple-400 hover:underline">Daftar disini</a>
        </div>
        <div class="mt-4 text-center">
            <a href="/" class="text-xs text-gray-600 hover:text-white">← Kembali ke Home</a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.innerHTML = 'Memproses...'; btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    // PENTING: Simpan username ke LocalStorage
                    localStorage.setItem('user_session', data.username);
                    alert("Login Berhasil!");
                    window.location.href = '/'; // Redirect ke Home
                } else {
                    alert("Gagal: " + data.message);
                    btn.innerHTML = 'Masuk Sekarang'; btn.disabled = false;
                }
            } catch (err) {
                alert("Error koneksi server");
                btn.innerHTML = 'Masuk Sekarang'; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
