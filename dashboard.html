<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manzzy ID Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="style.css"> 
    
    <link rel="stylesheet" href="dashboard/dashboard.css"> 
</head>
<body>
    <button id="logout-btn" class="logout-btn-fixed">Keluar</button>

    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="https://files.catbox.moe/inbf8k.mp4" type="video/mp4">
            Browser Anda tidak mendukung tag video.
        </video>
        <div class="header-content">
            <h1>Manzzy ID</h1>
            <p>Platform Terbaik untuk Kebutuhan Digital Anda</p>
        </div>
        <div class="user-profile">
            <div class="profile-pic"><i class="fas fa-user"></i></div>
            <div id="username-display" class="username-display">Loading...</div>
        </div>
    </div>

    <div class="main-content">
        <h2 class="section-title">Website Pilihan</h2>
        <div class="websites-grid" id="websites-list">
            <a href="https://example.com" target="_blank" class="website-card">
                <img src="https://via.placeholder.com/400x150/228B22/FFFFFF?text=Website+Satu" alt="Website Satu">
                <div class="overlay"><h3>Website Satu</h3></div>
            </a>
            <a href="https://google.com" target="_blank" class="website-card">
                <img src="https://via.placeholder.com/400x150/007bff/FFFFFF?text=Google" alt="Google">
                <div class="overlay"><h3>Google Search</h3></div>
            </a>
            <a href="https://github.com" target="_blank" class="website-card">
                <img src="https://via.placeholder.com/400x150/6a0dad/FFFFFF?text=GitHub" alt="GitHub">
                <div class="overlay"><h3>GitHub</h3></div>
            </a>
            <a href="https://youtube.com" target="_blank" class="website-card">
                <img src="https://via.placeholder.com/400x150/FF0000/FFFFFF?text=YouTube" alt="YouTube">
                <div class="overlay"><h3>YouTube</h3></div>
            </a>
        </div>

        <h2 class="section-title">Pembaruan & Informasi (Max 3)</h2>
        <div class="forms-section">
            <div class="admin-form-toggle">
                <button id="toggle-admin-form" style="display: none;">Tambah Post Admin</button>
            </div>
            
            <div id="add-form-panel" class="add-form-panel">
                <h3>Tambah Post Baru</h3>
                <form id="add-post-form">
                    <label for="post-title">Judul Post:</label>
                    <input type="text" id="post-title" required>

                    <label for="post-image-url">URL Gambar (Opsional):</label>
                    <input type="text" id="post-image-url" placeholder="https://example.com/gambar.jpg">

                    <label for="post-content">Konten (Teks atau HTML):</label>
                    <textarea id="post-content" required></textarea>

                    <button type="submit">Publish Post</button>
                </form>
            </div>

            <div class="forms-container" id="posts-list">
                <p id="no-posts-message">Belum ada post yang tersedia.</p>
            </div>
        </div>
    </div>

    <script src="dashboard/dashboard.js"></script>
</body>
</html>
